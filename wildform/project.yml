name: Wildform
options:
  bundleIdPrefix: com.whatmod
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Wildform:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Wildform
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Wildform uses your location to place nearby encounters and exploration discoveries on the map."
        NSMotionUsageDescription: "Wildform uses motion and step data to turn walking into Bio Energy and progression."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whatmod.wildform
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
