name: Build and Deploy whatmod.com

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'life/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('app/package.json') != '' }}
        with:
          node-version: 22

      - name: Install /app dependencies
        if: ${{ hashFiles('app/package.json') != '' }}
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build /app
        if: ${{ hashFiles('app/package.json') != '' }}
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Validate committed JustGlance static app
        shell: bash
        run: |
          set -euo pipefail
          test -f life/index.html
          test -s life/app.js
          test -s life/styles.css
          test -f life/config.js
          test -f life/runtime/main.js
          test -f life/manifest.webmanifest
          test -f life/runtime/contexts/OrganizerContext.js
          test -f life/runtime/pages/TasksPage.js
          test -f life/runtime/pages/PlannerPage.js
          test -f life/supabase/migrations/002_organizer_expansion.sql
          test -f life/icons/icon-192.png
          grep -q './app.js' life/index.html
          grep -q './styles.css' life/index.html
          ! grep -q 'generated-file guard' life/index.html
          ! grep -q 'JustGlance is publishing' life/index.html
          ! grep -q 'src/main.tsx' life/index.html
          ! grep -q '/life/assets/' life/index.html
          node --check life/app.js
          find life/runtime -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Assemble one Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'app' \
            ./ _site/

          if [ -d app/dist ]; then
            cp -R app/dist/. _site/app/
          fi

          touch _site/.nojekyll
          test -f _site/life/index.html
          test -s _site/life/app.js
          test -f _site/life/runtime/main.js
          test -f _site/life/runtime/pages/ProjectsPage.js
          test -f _site/life/supabase/migrations/002_organizer_expansion.sql

      - name: Inject JustGlance public Supabase configuration
        env:
          JUSTGLANCE_SUPABASE_URL: ${{ secrets.JUSTGLANCE_SUPABASE_URL }}
          JUSTGLANCE_SUPABASE_ANON_KEY: ${{ secrets.JUSTGLANCE_SUPABASE_ANON_KEY }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          url = os.environ.get('JUSTGLANCE_SUPABASE_URL','').strip()
          key = os.environ.get('JUSTGLANCE_SUPABASE_ANON_KEY','').strip()
          sha = os.environ.get('RELEASE_SHA','')[:12]
          p = pathlib.Path('_site/life/config.js')
          if url and key:
              if not url.startswith('https://'):
                  raise SystemExit('JUSTGLANCE_SUPABASE_URL must be an https URL')
              payload = {
                  'appVersion': '2.0.0-' + sha,
                  'demoMode': False,
                  'supabaseUrl': url,
                  'supabaseAnonKey': key,
              }
              p.write_text('window.__JUSTGLANCE_CONFIG__ = ' + json.dumps(payload, separators=(',',':')) + ';\n', encoding='utf-8')
              print('JustGlance Supabase public configuration injected into Pages artifact.')
          else:
              print('::warning::JustGlance Supabase secrets are missing; deployed app will use demo mode.')
          PY

      - name: Final Pages artifact checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q './app.js' _site/life/index.html
          grep -q 'direct-static-esm' _site/life/build-info.json
          test -s _site/life/config.js
          echo 'JustGlance public artifact:'
          find _site/life -maxdepth 2 -type f | sort | head -80

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
