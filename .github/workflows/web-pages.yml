name: Build and Deploy whatmod.com/app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove retired auth-bridge leftovers
        run: |
          rm -f app/src/auth/NativeAuthBridge.tsx app/public/native-auth-start.html

      - name: Validate web cloud configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL:-}" || { echo "::error title=AF-CFG-101::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY:-}" || { echo "::error title=AF-CFG-105::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify web build
        working-directory: app
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -d dist/assets
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          grep -q '/app/assets/' dist/index.html
          echo "Aurelium Field rebuilt web bundle verified."

      - name: Assemble Pages site preserving repository root
        run: |
          mkdir -p _site/app
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'app' ./ _site/
          cp -R app/dist/. _site/app/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
