name: Build and Deploy whatmod.com/app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Remove retired web-auth leftovers
        run: |
          rm -f app/src/auth/NativeAuthBridge.tsx app/public/native-auth-start.html

      - name: Protect stable web sign-in baseline
        run: |
          set -euo pipefail
          echo "750e5a9c4bd8b03e9776921c1501807b486c5ca8557fc2ff5dcf052046b806b0  app/src/auth/AuthGate.tsx" | sha256sum -c -
          echo "b7f048db9fce2694786c63c5ea234341b52b6ca8e9cd759c53281ed99b554832  app/src/lib/supabase.ts" | sha256sum -c -
          echo "Stable web sign-in source is unchanged."

      - name: Validate web cloud configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          test -n "${VITE_SUPABASE_URL:-}" || { echo "::error title=AF-CFG-101::Missing VITE_SUPABASE_URL"; exit 1; }
          test -n "${VITE_SUPABASE_ANON_KEY:-}" || { echo "::error title=AF-CFG-105::Missing VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify compiled web bundle
        working-directory: app
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          JS_FILE="$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          test -n "$JS_FILE"
          grep -q '/app/assets/' dist/index.html
          grep -q 'v0.9.3-field-time' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "::error title=AF-WEB-001::Vite source entry leaked into production HTML"
            exit 1
          fi
          echo '{"release":"v0.9.3","surface":"web","compiled":true}' > dist/build-info.json

      - name: Assemble Pages artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'app' ./ _site/
          cp -R app/dist/. _site/app/
          # Explicit copies make public assets deterministic even if Vite behavior changes.
          cp app/public/manifest.webmanifest _site/app/manifest.webmanifest
          cp app/public/sw.js _site/app/sw.js
          touch _site/.nojekyll
          test -f _site/app/index.html
          test -f _site/app/manifest.webmanifest
          test -f _site/app/build-info.json
          ASSET_PATH="$(grep -oE '/app/assets/[^\" ]+\.js' _site/app/index.html | head -1)"
          test -n "$ASSET_PATH"
          test -f "_site${ASSET_PATH}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment diagnostics
        shell: bash
        run: |
          echo "Pages deployment completed: ${{ steps.deployment.outputs.page_url }}"
          echo "Live custom-domain verification is intentionally non-blocking; DNS/CDN propagation can briefly return 404 after a successful Pages deployment."
