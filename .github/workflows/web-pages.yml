name: Build and Deploy whatmod.com/app

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove post-stable web auth experiments
        run: |
          rm -f app/src/auth/NativeAuthBridge.tsx
          rm -f app/public/native-auth-start.html
          echo "Post-v0.5.4 web auth experiment files removed from build checkout if present."
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Validate Supabase build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase configuration is missing. Add VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as repository Actions Variables or Secrets."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::error::VITE_SUPABASE_URL does not look like a Supabase project URL."; exit 1 ;;
          esac

      - name: Build web app
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Assemble Pages site preserving repository root
        run: |
          mkdir -p _site/app
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'app' ./ _site/
          cp -R app/dist/. _site/app/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
