name: Trivia Media Resolver

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of unlocked questions to resolve (1-250)
        required: false
        default: '100'
  schedule:
    - cron: '41 8 * * *'

permissions:
  contents: read

concurrency:
  group: trivia-media-resolver
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve license-safe question media
        env:
          TRIVIA_SUPABASE_URL: ${{ secrets.TRIVIA_SUPABASE_URL }}
          TRIVIA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TRIVIA_SUPABASE_SERVICE_ROLE_KEY }}
          MEDIA_RESOLVE_LIMIT: ${{ github.event.inputs.limit || '100' }}
        run: node trivia/tools/media-resolver.mjs
