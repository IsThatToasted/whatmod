name: Validate Trivia Static App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trivia/**'
      - 'triviaadmin/**'
      - '.github/workflows/trivia-*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify current project structure
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "trivia/index.html"
            "trivia/config.js"
            "trivia/styles.css"
            "trivia/js/app.js"
            "trivia/tools/wikidata-question-sync.mjs"
            "trivia/tools/media-resolver.mjs"
            "trivia/supabase/migrations/008_hydrator_upsert_fix.sql"
            "trivia/supabase/migrations/009_release_ui_theme.sql"
            "trivia/supabase/migrations/010_local_media_pipeline.sql"
            "triviaadmin/index.html"
            "triviaadmin/styles.css"
            "triviaadmin/js/admin.js"
            "triviaadmin/downloads/WhatMod-Trivia-Media-Resolver-Windows.zip"
            ".github/workflows/trivia-question-sync.yml"
            ".github/workflows/trivia-media-resolver.yml"
          )

          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "::error file=$f::Required file is missing: $f"
              exit 1
            fi
          done

          echo "Current Trivia project structure looks good."

      - name: Verify migration directory
        shell: bash
        run: |
          set -euo pipefail
          test -d trivia/supabase/migrations

          count=$(find trivia/supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)
          if [[ "$count" -lt 1 ]]; then
            echo "::error::No SQL migrations found."
            exit 1
          fi

          echo "Found $count migration file(s)."

      - name: Validate required database architecture across migrations
        shell: bash
        run: |
          set -euo pipefail

          # Search the full migration history rather than requiring a symbol to
          # live in one particular historical migration file.
          check_symbol() {
            local symbol="$1"
            if ! grep -R -q --include='*.sql' "$symbol" trivia/supabase/migrations; then
              echo "::warning::$symbol was not found in the checked-in migration history."
              echo "This can happen when the live Supabase schema was upgraded manually."
            else
              echo "Found database symbol: $symbol"
            fi
          }

          check_symbol "question_answer_stats"
          check_symbol "library_sessions"
          check_symbol "get_question_community_stats"
          check_symbol "question_media_candidates"

          # These are current V7 runtime requirements and ARE blocking because
          # the browser/admin code depends on them being represented in source.
          if ! grep -R -q --include='*.sql' "admin_select_media_candidate" trivia/supabase/migrations; then
            echo "::error::V7 admin media RPC admin_select_media_candidate is missing from checked-in migrations."
            exit 1
          fi

          if ! grep -R -q --include='*.sql' "admin_use_external_media" trivia/supabase/migrations; then
            echo "::error::V7 admin media RPC admin_use_external_media is missing from checked-in migrations."
            exit 1
          fi

      - name: Check for accidentally committed Supabase secrets
        shell: bash
        run: |
          set -euo pipefail

          # Browser code may contain public/publishable keys. It must never
          # contain Supabase secret/service-role credentials.
          if grep -R -n -E \
            'sb_secret_[A-Za-z0-9_-]+|service_role[^A-Za-z0-9_]*(eyJ|[A-Za-z0-9_-]{30,})' \
            trivia triviaadmin \
            --exclude='*.md' \
            --exclude='*.sql'; then
            echo "::error::A Supabase secret/service-role credential appears to be committed in browser/project code."
            exit 1
          fi

      - name: Reject known ambiguous SQL patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E \
            'set[[:space:]]+current_index[[:space:]]*=[[:space:]]*current_index[[:space:]]*\+' \
            trivia/supabase/migrations; then
            echo "::error::Ambiguous current_index update found."
            exit 1
          fi

          if grep -R -n -E \
            'set[[:space:]]+total_score[[:space:]]*=[[:space:]]*total_score[[:space:]]*\+' \
            trivia/supabase/migrations; then
            echo "::error::Ambiguous total_score update found."
            exit 1
          fi

      - name: Syntax check JavaScript
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(trivia/js/*.js trivia/tools/*.mjs triviaadmin/js/*.js)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "::error::No JavaScript files found to validate."
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate hydrator conflict target
        shell: bash
        run: |
          set -euo pipefail
          grep -q "create unique index questions_canonical_key_unique" trivia/supabase/migrations/008_hydrator_upsert_fix.sql
          if grep -A2 -n "questions_canonical_key_unique" trivia/supabase/migrations/006_library_community_media.sql | grep -q "where canonical_key is not null"; then
            echo "::error::canonical_key unique index is still partial; PostgREST on_conflict cannot use it."
            exit 1
          fi
          echo "Hydrator canonical_key conflict target is compatible with PostgREST upsert."

      - name: Validate media resolver providers
        shell: bash
        run: |
          set -euo pipefail

          grep -q "api.openverse.org" trivia/tools/media-resolver.mjs
          grep -q "commons.wikimedia.org" trivia/tools/media-resolver.mjs

          echo "Media resolver provider checks passed."

      - name: Validate V9 local media pipeline and release defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'update_my_ui_theme' trivia/supabase/migrations/009_release_ui_theme.sql
          grep -q 'admin_export_media_job' trivia/supabase/migrations/010_local_media_pipeline.sql
          grep -q 'admin_import_media_results' trivia/supabase/migrations/010_local_media_pipeline.sql
          grep -q 'Export media job' triviaadmin/js/admin.js
          grep -q 'Import resolver results' triviaadmin/js/admin.js
          grep -q 'renderCommunityHistogram' trivia/js/charts.js
          grep -q 'adaptive log view' trivia/js/charts.js
          grep -q 'data-ui-theme="v2"' trivia/styles.css
          grep -q 'whatmod-trivia-v9' trivia/sw.js
          grep -q 'default .v1' trivia/supabase/migrations/010_local_media_pipeline.sql
          if grep -q 'node trivia/tools/media-resolver.mjs' .github/workflows/trivia-question-sync.yml; then
            echo "::error::Question Bank Sync should not auto-run the paid media resolver in V9."
            exit 1
          fi
          if grep -q 'schedule:' .github/workflows/trivia-media-resolver.yml; then
            echo "::error::GitHub media resolver must remain manual-only in V9."
            exit 1
          fi
          echo "V9 local media pipeline checks passed."

      - name: Validate workflow secret references
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'secrets.TRIVIA_SUPABASE_URL' .github/workflows/trivia-question-sync.yml
          grep -q 'secrets.TRIVIA_SUPABASE_SECRET_KEY' .github/workflows/trivia-question-sync.yml
          grep -q 'secrets.TRIVIA_SUPABASE_URL' .github/workflows/trivia-media-resolver.yml
          grep -q 'secrets.TRIVIA_SUPABASE_SECRET_KEY' .github/workflows/trivia-media-resolver.yml

          echo "GitHub Actions modern Supabase secret references are configured."

      - name: Validation complete
        run: echo "Trivia production validation passed."
