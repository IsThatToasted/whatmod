name: JustGlance iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'life/ios/**'
      - '.github/workflows/justglance-ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build unsigned app
        working-directory: life
        run: |
          rm -rf build/ios
          xcodebuild \
            -project ios/JustGlance.xcodeproj \
            -scheme JustGlance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name 'JustGlance.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qry JustGlance-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: JustGlance-unsigned-IPA
          path: life/build/JustGlance-unsigned.ipa
          if-no-files-found: error
