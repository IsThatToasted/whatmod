name: Build ScooterCast iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ios/ScooterCast/**"
      - ".github/workflows/scootercast-ios-build.yml"

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios/ScooterCast

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify ScooterCast folder
        run: |
          echo "ScooterCast working directory:"
          pwd
          echo
          find . -maxdepth 2 -type f | sort
          echo

          test -f project.yml || {
            echo "::error::ios/ScooterCast/project.yml is missing."
            exit 1
          }

          test -f ScooterCastApp.swift || {
            echo "::error::ScooterCastApp.swift is missing."
            exit 1
          }

          test -f Config.swift || {
            echo "::error::Config.swift is missing."
            exit 1
          }

          test -f Info.plist || {
            echo "::error::Info.plist is missing."
            exit 1
          }

          plutil -lint Info.plist

      - name: Verify rider secret
        env:
          RIDER_ADMIN_KEY: ${{ secrets.RIDER_ADMIN_KEY }}
        run: |
          if [ -z "$RIDER_ADMIN_KEY" ]; then
            echo "::error::Missing GitHub repository secret RIDER_ADMIN_KEY"
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Swift source preflight
        run: |
          if grep -R -n -F '\\n        var ' --include='*.swift' .; then
            echo "::error::Found a literal backslash-n sequence in Swift source."
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d ScooterCast.xcodeproj

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          xcodebuild \
            -project ScooterCast.xcodeproj \
            -scheme ScooterCast \
            -resolvePackageDependencies | tee resolve-packages.log

      - name: Build unsigned iPhone app
        env:
          RIDER_ADMIN_KEY: ${{ secrets.RIDER_ADMIN_KEY }}
        run: |
          set -o pipefail
          mkdir -p build

          xcodebuild \
            -project ScooterCast.xcodeproj \
            -scheme ScooterCast \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            SCOOTERCAST_RIDER_KEY="$RIDER_ADMIN_KEY" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build/build.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::No Release iPhone .app was produced."
            find build/DerivedData/Build/Products -maxdepth 3 -type d || true
            exit 1
          fi

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          echo "Built app Info.plist:"
          plutil -p "$APP_PATH/Info.plist"

          echo "Linked frameworks:"
          find "$APP_PATH/Frameworks" -maxdepth 2 -type f 2>/dev/null | sort || true

          cd build
          zip -r ScooterCast-unsigned.ipa Payload

      - name: Upload ScooterCast IPA
        uses: actions/upload-artifact@v6
        with:
          name: ScooterCast-iOS-unsigned
          path: ios/ScooterCast/build/ScooterCast-unsigned.ipa
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ScooterCast-build-diagnostics
          path: |
            ios/ScooterCast/build/build.log
            ios/ScooterCast/resolve-packages.log
          if-no-files-found: ignore
