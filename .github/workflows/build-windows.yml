name: Build Wildform Studio (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Wildform Studio
        run: npm run build

      - name: Verify release output
        shell: pwsh
        run: |
          if (!(Test-Path "release")) {
            throw "The release directory was not created."
          }
          Get-ChildItem -Path release -Recurse | Select-Object FullName, Length

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: WildformStudio-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
