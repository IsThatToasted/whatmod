name: Deploy ScooterCast Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      RIDER_ADMIN_KEY: ${{ secrets.RIDER_ADMIN_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN LIVEKIT_API_SECRET RIDER_ADMIN_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Install Supabase CLI
        run: npm install --global supabase

      - name: Configure Edge Function secrets
        run: |
          supabase secrets set \
            --project-ref pcsrsfghbmvgfqwmldfi \
            LIVEKIT_URL="wss://scootercast-xhfuctrp.livekit.cloud" \
            LIVEKIT_API_KEY="APIdEEZcBJ3HjKx" \
            LIVEKIT_API_SECRET="$LIVEKIT_API_SECRET" \
            RIDER_ADMIN_KEY="$RIDER_ADMIN_KEY"

      - name: Deploy ride-api
        run: |
          supabase functions deploy ride-api \
            --project-ref pcsrsfghbmvgfqwmldfi \
            --no-verify-jwt

      - name: Done
        run: |
          echo "ScooterCast backend deployed."
          echo "Function: https://pcsrsfghbmvgfqwmldfi.supabase.co/functions/v1/ride-api"
