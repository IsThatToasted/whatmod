name: Build Aurelium Field iOS

on:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-ipa:
    name: Build iPhone IPA
    runs-on: macos-15
    env:
      APP_CLOUD_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      APP_CLOUD_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    defaults:
      run:
        working-directory: app/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate app configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLOUD_URL:-}" || -z "${APP_CLOUD_PUBLIC_KEY:-}" ]]; then
            echo "::error title=AF-CFG-001::Required iOS build configuration is missing."
            exit 1
          fi
          if [[ "$APP_CLOUD_URL" != https://* ]]; then
            echo "::error title=AF-CFG-001::The configured service endpoint is invalid."
            exit 1
          fi
          echo "iOS runtime configuration inputs are present."

      - name: Generate bundled runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "cloudURL": os.environ["APP_CLOUD_URL"].strip(),
              "publicKey": os.environ["APP_CLOUD_PUBLIC_KEY"].strip(),
          }
          output = Path("AureliumField/Resources/RuntimeConfig.json")
          output.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")
          PY
          echo "Runtime configuration resource generated (values hidden)."

      - name: Verify generated runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("AureliumField/Resources/RuntimeConfig.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("cloudURL") != os.environ["APP_CLOUD_URL"].strip():
              raise SystemExit("AF-CFG-001: generated service endpoint did not match build input")
          if payload.get("publicKey") != os.environ["APP_CLOUD_PUBLIC_KEY"].strip():
              raise SystemExit("AF-CFG-001: generated public client key did not match build input")
          if not payload["cloudURL"].startswith("https://") or not payload["publicKey"]:
              raise SystemExit("AF-CFG-001: generated runtime configuration is incomplete")
          PY
          echo "Generated runtime resource verified."

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AureliumField.xcodeproj \
            -scheme AureliumField \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build | tee xcodebuild-device.log

      - name: Verify runtime configuration inside built app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/AureliumField"

          CONFIG_PATH="$(find "$APP_PATH" -type f -name 'RuntimeConfig.json' -print -quit)"
          if [[ -z "$CONFIG_PATH" || ! -f "$CONFIG_PATH" ]]; then
            echo "::error title=AF-CFG-001::The built iOS app is missing its runtime configuration resource."
            exit 1
          fi

          export BUILT_RUNTIME_CONFIG="$CONFIG_PATH"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["BUILT_RUNTIME_CONFIG"]).read_text(encoding="utf-8"))
          expected_url = os.environ["APP_CLOUD_URL"].strip()
          expected_key = os.environ["APP_CLOUD_PUBLIC_KEY"].strip()
          if payload.get("cloudURL") != expected_url or payload.get("publicKey") != expected_key:
              raise SystemExit("AF-CFG-001: built application runtime configuration did not match build inputs")
          if not payload.get("cloudURL", "").startswith("https://") or not payload.get("publicKey"):
              raise SystemExit("AF-CFG-001: built application runtime configuration is incomplete")
          PY
          echo "Built iOS runtime configuration verified (values hidden)."

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          test -d "$APP_PATH"
          rm -rf Payload AureliumField.ipa
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/AureliumField.app"
          /usr/bin/zip -qry AureliumField.ipa Payload
          echo "Created AureliumField.ipa"
          ls -lh AureliumField.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-iPhone-IPA
          path: app/ios/AureliumField.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-xcodebuild-log
          path: app/ios/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7
