name: Build Aurelium Field iOS

on:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-ipa:
    name: Build iPhone IPA
    runs-on: macos-15
    env:
      APP_CLOUD_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      APP_CLOUD_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID || secrets.GOOGLE_IOS_CLIENT_ID }}
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_WEB_CLIENT_ID }}
    defaults:
      run:
        working-directory: app/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate build configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLOUD_URL:-}" || -z "${APP_CLOUD_PUBLIC_KEY:-}" ]]; then
            echo "::error title=AF-CFG-001::Required iOS workspace configuration is missing."
            exit 1
          fi
          if [[ "$APP_CLOUD_URL" != https://* ]]; then
            echo "::error title=AF-CFG-104::The configured workspace endpoint is invalid."
            exit 1
          fi
          if [[ -z "${GOOGLE_IOS_CLIENT_ID:-}" || -z "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            echo "::error title=AF-AUTH-109::Native Google sign-in client configuration is missing."
            exit 1
          fi
          if [[ "$GOOGLE_IOS_CLIENT_ID" != *.apps.googleusercontent.com || "$GOOGLE_WEB_CLIENT_ID" != *.apps.googleusercontent.com ]]; then
            echo "::error title=AF-AUTH-109::Native Google sign-in client configuration is invalid."
            exit 1
          fi
          echo "iOS workspace and native sign-in inputs are present."

      - name: Generate native runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path

          cloud_url = os.environ["APP_CLOUD_URL"].strip()
          cloud_key = os.environ["APP_CLOUD_PUBLIC_KEY"].strip()
          ios_client = os.environ["GOOGLE_IOS_CLIENT_ID"].strip()
          web_client = os.environ["GOOGLE_WEB_CLIENT_ID"].strip()

          payload = {
              "cloudURL": cloud_url,
              "publicKey": cloud_key,
              "googleIOSClientID": ios_client,
              "googleWebClientID": web_client,
          }
          runtime = Path("AureliumField/Resources/RuntimeConfig.json")
          runtime.write_text(json.dumps(payload, separators=(",", ":")), encoding="utf-8")

          suffix = ".apps.googleusercontent.com"
          if not ios_client.endswith(suffix):
              raise SystemExit("AF-AUTH-109: native client ID format is invalid")
          reversed_client = "com.googleusercontent.apps." + ios_client[:-len(suffix)]

          plist_path = Path("AureliumField/Resources/Info.plist")
          with plist_path.open("rb") as handle:
              plist = plistlib.load(handle)

          url_types = []
          for entry in plist.get("CFBundleURLTypes", []):
              schemes = [str(value) for value in entry.get("CFBundleURLSchemes", [])]
              if any(value.startswith("com.googleusercontent.apps.") for value in schemes):
                  continue
              url_types.append(entry)

          url_types.append({
              "CFBundleTypeRole": "Editor",
              "CFBundleURLName": "google-sign-in",
              "CFBundleURLSchemes": [reversed_client],
          })
          plist["CFBundleURLTypes"] = url_types
          plist["GIDClientID"] = ios_client
          plist["GIDServerClientID"] = web_client

          with plist_path.open("wb") as handle:
              plistlib.dump(plist, handle, sort_keys=False)
          PY
          echo "Native runtime configuration generated (values hidden)."

      - name: Verify generated native configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path

          payload = json.loads(Path("AureliumField/Resources/RuntimeConfig.json").read_text(encoding="utf-8"))
          expected = {
              "cloudURL": os.environ["APP_CLOUD_URL"].strip(),
              "publicKey": os.environ["APP_CLOUD_PUBLIC_KEY"].strip(),
              "googleIOSClientID": os.environ["GOOGLE_IOS_CLIENT_ID"].strip(),
              "googleWebClientID": os.environ["GOOGLE_WEB_CLIENT_ID"].strip(),
          }
          if payload != expected:
              raise SystemExit("AF-CFG-103: generated native runtime configuration did not match build inputs")

          with Path("AureliumField/Resources/Info.plist").open("rb") as handle:
              plist = plistlib.load(handle)
          schemes = [scheme for entry in plist.get("CFBundleURLTypes", []) for scheme in entry.get("CFBundleURLSchemes", [])]
          suffix = ".apps.googleusercontent.com"
          reversed_client = "com.googleusercontent.apps." + expected["googleIOSClientID"][:-len(suffix)]
          if reversed_client not in schemes:
              raise SystemExit("AF-AUTH-109: generated Info.plist is missing the native Google callback scheme")
          if plist.get("GIDClientID") != expected["googleIOSClientID"] or plist.get("GIDServerClientID") != expected["googleWebClientID"]:
              raise SystemExit("AF-AUTH-109: generated Info.plist client configuration did not match build inputs")
          PY
          echo "Generated native sign-in configuration verified."

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild \
            -project AureliumField.xcodeproj \
            -scheme AureliumField \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build | tee xcodebuild-device.log

      - name: Verify built application configuration
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/AureliumField"

          CONFIG_PATHS="$(find "$APP_PATH" -type f -name 'RuntimeConfig.json' -print)"
          CONFIG_COUNT="$(printf '%s\n' "$CONFIG_PATHS" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$CONFIG_COUNT" -ne 1 ]]; then
            echo "::error title=AF-CFG-103::Built app runtime resource count was ${CONFIG_COUNT}."
            exit 1
          fi
          CONFIG_PATH="$(printf '%s\n' "$CONFIG_PATHS" | head -n 1)"
          export BUILT_RUNTIME_CONFIG="$CONFIG_PATH"
          export BUILT_APP_INFO_PLIST="$APP_PATH/Info.plist"

          python3 - <<'PY'
          import json, os, plistlib
          from pathlib import Path

          expected = {
              "cloudURL": os.environ["APP_CLOUD_URL"].strip(),
              "publicKey": os.environ["APP_CLOUD_PUBLIC_KEY"].strip(),
              "googleIOSClientID": os.environ["GOOGLE_IOS_CLIENT_ID"].strip(),
              "googleWebClientID": os.environ["GOOGLE_WEB_CLIENT_ID"].strip(),
          }
          payload = json.loads(Path(os.environ["BUILT_RUNTIME_CONFIG"]).read_text(encoding="utf-8"))
          if payload != expected:
              raise SystemExit("AF-CFG-103: built app runtime configuration did not match build inputs")

          with Path(os.environ["BUILT_APP_INFO_PLIST"]).open("rb") as handle:
              plist = plistlib.load(handle)
          schemes = [scheme for entry in plist.get("CFBundleURLTypes", []) for scheme in entry.get("CFBundleURLSchemes", [])]
          suffix = ".apps.googleusercontent.com"
          reversed_client = "com.googleusercontent.apps." + expected["googleIOSClientID"][:-len(suffix)]
          if reversed_client not in schemes:
              raise SystemExit("AF-AUTH-109: built app is missing the native Google callback scheme")
          if plist.get("GIDClientID") != expected["googleIOSClientID"] or plist.get("GIDServerClientID") != expected["googleWebClientID"]:
              raise SystemExit("AF-AUTH-109: built app Google client configuration did not match build inputs")
          PY
          echo "Built native app configuration verified (values hidden)."

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          rm -rf Payload AureliumField.ipa
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/AureliumField.app"
          /usr/bin/zip -qry AureliumField.ipa Payload
          ls -lh AureliumField.ipa

      - name: Verify packaged IPA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, plistlib, zipfile

          expected = {
              "cloudURL": os.environ["APP_CLOUD_URL"].strip(),
              "publicKey": os.environ["APP_CLOUD_PUBLIC_KEY"].strip(),
              "googleIOSClientID": os.environ["GOOGLE_IOS_CLIENT_ID"].strip(),
              "googleWebClientID": os.environ["GOOGLE_WEB_CLIENT_ID"].strip(),
          }
          with zipfile.ZipFile("AureliumField.ipa") as archive:
              configs = [name for name in archive.namelist() if name.endswith("/RuntimeConfig.json")]
              if len(configs) != 1:
                  raise SystemExit(f"AF-CFG-103: packaged IPA runtime resource count was {len(configs)}")
              payload = json.loads(archive.read(configs[0]).decode("utf-8"))
              if payload != expected:
                  raise SystemExit("AF-CFG-103: packaged IPA runtime configuration did not match build inputs")

              plist_name = "Payload/AureliumField.app/Info.plist"
              plist = plistlib.loads(archive.read(plist_name))
              schemes = [scheme for entry in plist.get("CFBundleURLTypes", []) for scheme in entry.get("CFBundleURLSchemes", [])]
              suffix = ".apps.googleusercontent.com"
              reversed_client = "com.googleusercontent.apps." + expected["googleIOSClientID"][:-len(suffix)]
              if reversed_client not in schemes:
                  raise SystemExit("AF-AUTH-109: packaged IPA is missing the native Google callback scheme")
          print("Packaged IPA native sign-in configuration verified.")
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-iPhone-IPA
          path: app/ios/AureliumField.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-xcodebuild-log
          path: app/ios/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7
