name: Build Aurelium Field iOS

on:
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-ipa:
    name: Build iPhone IPA
    runs-on: macos-15
    defaults:
      run:
        working-directory: app/ios
    env:
      APP_CLOUD_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      APP_CLOUD_PUBLIC_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove retired native auth leftovers
        run: |
          set -euo pipefail
          # GitHub's browser upload UI adds/replaces files but does not remove files
          # that disappeared from a newer release. These paths belong to retired
          # authentication experiments and are not part of the active XcodeGen source list.
          rm -f \
            AureliumField/Services/NativeOAuthCoordinator.swift \
            AureliumField/Services/NativeGoogleAuth.swift \
            AureliumField/Services/SupabaseService.swift
          echo "Retired native auth leftovers removed from Actions checkout."

      - name: Protect stable sign-in baseline
        run: |
          set -euo pipefail
          echo "1b650380c4c46c93feeaaa3fbb659c151ee7dafdb12cff3a58655b80548f0494  AureliumField/Services/WorkspaceService.swift" | shasum -a 256 -c -
          echo "2f1e76617b37a53a9cd2ca39ffb5168eccaca9826c12342fdb78901ebecc5b77  AureliumField/Features/AuthView.swift" | shasum -a 256 -c -
          echo "fd565c7646a4f412d6b3fc18a2363a2f2c5ff33206294ba2ff0e371c6e2bf68f  AureliumField/App/AureliumFieldApp.swift" | shasum -a 256 -c -
          echo "Stable v0.9.2 sign-in/workspace bootstrap source is unchanged."

      - name: Validate native architecture
        run: |
          set -euo pipefail
          # Validate the sanitized checkout. Stale files retained by GitHub uploads
          # cannot block or contaminate this build.
          if grep -RniE '^import Supabase|SupabaseClient|supabase-swift|GoogleSignIn|GIDSignIn|whatmod.com/app/ios-auth.html' AureliumField project.yml; then
            echo "::error title=AF-IOS-002::Retired native auth implementation is still present after checkout sanitation."
            exit 1
          fi
          grep -q 'UIApplication.shared.open' AureliumField/Services/WorkspaceService.swift
          grep -q '/auth/v1/authorize' AureliumField/Services/WorkspaceService.swift
          grep -q 'provider.*google' AureliumField/Services/WorkspaceService.swift
          grep -q 'redirect_to.*aureliumfield://auth-callback' AureliumField/Services/WorkspaceService.swift
          grep -q 'handleOAuthCallback' AureliumField/Services/WorkspaceService.swift
          grep -q 'onOpenURL' AureliumField/App/AureliumFieldApp.swift
          if grep -q 'Dictionary(uniqueKeysWithValues' AureliumField/Services/WorkspaceService.swift; then
            echo "::error title=AF-IOS-003::Unsafe OAuth callback parser is present."
            exit 1
          fi
          grep -q 'URLSession.shared.data' AureliumField/Services/WorkspaceService.swift
          grep -q 'native-session-v4' AureliumField/Services/WorkspaceService.swift
          grep -q 'workspace_entering' AureliumField/Services/WorkspaceService.swift
          grep -q 'SignedInCheckpointView' AureliumField/Features/AuthView.swift
          grep -q 'workspacePrepared' AureliumField/Services/WorkspaceService.swift
          grep -q 'enterPreparedWorkspace' AureliumField/Services/WorkspaceService.swift
          grep -q 'membership_request_constructed' AureliumField/Services/WorkspaceService.swift
          grep -q 'WorkspaceBootstrapTransport' AureliumField/Services/WorkspaceService.swift
          grep -q 'session.dataTask(with: request)' AureliumField/Services/WorkspaceService.swift
          grep -q 'membership_response_received' AureliumField/Services/WorkspaceService.swift
          grep -q 'JSONSerialization.jsonObject' AureliumField/Services/WorkspaceService.swift
          grep -q 'retryOnUnauthorized: false' AureliumField/Services/WorkspaceService.swift
          if grep -q 'organizations(id,name,slug)' AureliumField/Services/WorkspaceService.swift; then
            echo "::error title=AF-WORK-204::Nested organization relationship is still present in workspace repair."
            exit 1
          fi
          if grep -q 'await model.refreshProjectsFromCloud()' AureliumField/Features/AuthView.swift; then
            echo "::error title=AF-WORK-202::Authenticated root still performs automatic project sync during workspace entry."
            exit 1
          fi
          echo "Direct Supabase Google OAuth + callback-based workspace bootstrap transport confirmed."

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate cloud build configuration
        run: |
          set -euo pipefail
          if [ -z "${APP_CLOUD_URL:-}" ] || [ -z "${APP_CLOUD_PUBLIC_KEY:-}" ]; then
            echo "::error title=AF-CFG-101::Aurelium Field iOS is missing its workspace build configuration."
            exit 1
          fi
          case "$APP_CLOUD_URL" in https://*) ;; *) echo "::error title=AF-CFG-104::Workspace endpoint is invalid."; exit 1;; esac
          python3 - <<'PYCFG'
          import os, sys
          for name in ('APP_CLOUD_URL','APP_CLOUD_PUBLIC_KEY'):
              value=os.environ[name].strip()
              if not value or any(ord(c) < 0x21 or ord(c) == 0x7f for c in value):
                  sys.exit(f'AF-CFG-106: {name} contains an unsafe HTTP header/config character')
          print('Workspace configuration contains only header-safe characters.')
          PYCFG
          echo "Workspace build configuration resolved."
          grep -q 'safeAccessToken' AureliumField/Services/WorkspaceService.swift
          grep -q 'get_my_workspace' AureliumField/Services/WorkspaceService.swift
          test -f AureliumField/Services/FieldOperationsService.swift
          grep -q 'field_records' AureliumField/Services/FieldOperationsService.swift
          grep -q 'loadMembershipProduction' AureliumField/Services/WorkspaceService.swift
          if grep -n 'Task { await cloud.confirmWorkspaceEntry() }' AureliumField/Features/AuthView.swift; then echo "::error title=AF-IOS-004::Workspace repair must not cross Swift concurrency at transport start."; exit 1; fi

      - name: Generate bundled runtime configuration
        run: |
          set -euo pipefail
          mkdir -p AureliumField/Resources
          python3 - <<'PY'
          import json, os
          with open('AureliumField/Resources/RuntimeConfig.json','w',encoding='utf-8') as f:
              json.dump({'cloudURL':os.environ['APP_CLOUD_URL'].strip(),'publicKey':os.environ['APP_CLOUD_PUBLIC_KEY'].strip()},f,separators=(',',':'))
          PY

      - name: Generate Xcode project
        run: |
          rm -rf AureliumField.xcodeproj DerivedData Payload AureliumField.ipa
          xcodegen generate

      - name: Verify generated Info.plist value types
        run: |
          set -euo pipefail
          python3 - <<'PYPLIST'
          import plistlib, pathlib, sys
          path=pathlib.Path('AureliumField/Resources/Info.plist')
          with path.open('rb') as f: info=plistlib.load(f)
          for key in ('CFBundleShortVersionString','CFBundleVersion'):
              value=info.get(key)
              if not isinstance(value, str):
                  sys.exit(f'AF-IOS-005: {key} must be a plist string, got {type(value).__name__}: {value!r}')
          print('Generated Info.plist version fields are strings:', info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PYPLIST

      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project AureliumField.xcodeproj \
            -scheme AureliumField \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            clean build | tee xcodebuild-device.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::group::Swift/Xcode compiler diagnostics"
            python3 - <<'PYDIAG'
          import pathlib, re
          log = pathlib.Path('xcodebuild-device.log')
          if log.exists():
              lines = log.read_text(errors='replace').splitlines()
              interesting = [line for line in lines if re.search(r'\berror:|failed frontend command|SwiftCompile|CompileSwift', line, re.I)]
              for line in interesting[-160:]:
                  print(line)
          PYDIAG
            echo "::endgroup::"
            exit "$BUILD_STATUS"
          fi

      - name: Smoke test app launch in iPhone Simulator
        run: |
          set -euo pipefail

          SIM_UDID="$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name','').startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No available iPhone Simulator found')
          PY
          )"

          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          set -o pipefail
          xcodebuild \
            -project AureliumField.xcodeproj \
            -scheme AureliumField \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath DerivedDataSimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ENABLE_BATCH_MODE=NO \
            clean build | tee xcodebuild-simulator.log

          SIM_APP="DerivedDataSimulator/Build/Products/Debug-iphonesimulator/AureliumField.app"
          test -d "$SIM_APP"
          xcrun simctl install "$SIM_UDID" "$SIM_APP"
          xcrun simctl launch "$SIM_UDID" com.aurelium.field
          sleep 5

          # Exercise the real SwiftUI deep-link callback path with duplicate OAuth keys.
          # Older callback parsing used Dictionary(uniqueKeysWithValues:) and could fatal-error here.
          xcrun simctl openurl "$SIM_UDID" 'aureliumfield://auth-callback#error=access_denied&error_description=first&error_description=second'
          sleep 2

          # Verify callback handling did not poison the next launch.
          xcrun simctl terminate "$SIM_UDID" com.aurelium.field
          xcrun simctl launch "$SIM_UDID" com.aurelium.field
          sleep 3

          if ! xcrun simctl terminate "$SIM_UDID" com.aurelium.field; then
            echo "::error title=AF-IOS-001::Aurelium Field exited during startup or OAuth callback handling in the iPhone Simulator."
            xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact --predicate 'process == "AureliumField"' || true
            exit 1
          fi

          echo "Aurelium Field survived launch and OAuth callback smoke tests."

      - name: Verify built application
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/AureliumField"
          echo "Device binary dependencies:"
          otool -L "$APP_PATH/AureliumField"
          python3 - <<'PY'
          import json, os, pathlib, plistlib, sys
          app=pathlib.Path('DerivedData/Build/Products/Release-iphoneos/AureliumField.app')
          expected_url=os.environ['APP_CLOUD_URL'].strip(); expected_key=os.environ['APP_CLOUD_PUBLIC_KEY'].strip()
          configs=list(app.rglob('RuntimeConfig.json'))
          if not configs:
              sys.exit('AF-CFG-101: built app is missing RuntimeConfig.json')
          data=json.loads(configs[0].read_text())
          if data.get('cloudURL') != expected_url or data.get('publicKey') != expected_key:
              sys.exit('AF-CFG-103: built runtime configuration does not match GitHub configuration')
          with open(app/'Info.plist','rb') as f: info=plistlib.load(f)
          for key in ('CFBundleShortVersionString','CFBundleVersion'):
              value=info.get(key)
              if not isinstance(value, str):
                  sys.exit(f'AF-IOS-005: built app {key} must be a plist string, got {type(value).__name__}: {value!r}')
          schemes=[]
          for item in info.get('CFBundleURLTypes',[]): schemes += item.get('CFBundleURLSchemes',[])
          print('Built app runtime configuration verified.')
          print('Launch metadata:', 'present' if 'UILaunchScreen' in info else 'not reported by processed plist')
          print('Aurelium callback scheme:', 'present' if 'aureliumfield' in schemes else 'not reported by processed plist')
          PY

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/AureliumField.app"
          rm -rf Payload AureliumField.ipa
          mkdir -p Payload
          ditto "$APP_PATH" "Payload/AureliumField.app"
          /usr/bin/zip -qry AureliumField.ipa Payload
          ls -lh AureliumField.ipa

      - name: Verify final IPA Info.plist value types
        run: |
          set -euo pipefail
          TMP_IPA="$(mktemp -d)"
          unzip -q AureliumField.ipa -d "$TMP_IPA"
          python3 - "$TMP_IPA/Payload/AureliumField.app/Info.plist" <<'PYIPA'
          import plistlib, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          with path.open('rb') as f: info=plistlib.load(f)
          for key in ('CFBundleShortVersionString','CFBundleVersion'):
              value=info.get(key)
              if not isinstance(value, str):
                  sys.exit(f'AF-IOS-005: final IPA {key} must be a plist string, got {type(value).__name__}: {value!r}')
          print('Final IPA version fields are strings:', info['CFBundleShortVersionString'], info['CFBundleVersion'])
          PYIPA
          rm -rf "$TMP_IPA"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-iPhone-IPA-v0.10.2-ios-navigation-fix
          path: app/ios/AureliumField.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AureliumField-xcodebuild-log-v0.10.2-ios-navigation-fix
          path: app/ios/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 7
