name: JustGlance Web Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'life/**'
      - '.github/workflows/justglance-web-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.JUSTGLANCE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.JUSTGLANCE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: justglance-web-dist
          path: life/dist
          if-no-files-found: error
