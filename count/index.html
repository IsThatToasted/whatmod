<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="CountLab — a professional blackjack card-counting course and training simulator." />
  <title>CountLab — Card Counting Course</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark">CL</div>
        <div>
          <div class="brand">CountLab</div>
          <div class="brand-sub">Training Academy</div>
        </div>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="course"><span>◫</span> Course</button>
        <button class="nav-item" data-view="drills"><span>⚡</span> Drills</button>
        <button class="nav-item" data-view="shoe"><span>♠</span> Shoe Trainer</button>
        <button class="nav-item" data-view="exam"><span>✓</span> Certification</button>
        <button class="nav-item" data-view="reference"><span>◎</span> Reference</button>
      </nav>

      <div class="sidebar-card">
        <div class="eyebrow">Current level</div>
        <div class="level-row"><strong id="sidebarLevel">Foundation</strong><span id="sidebarPct">0%</span></div>
        <div class="progress-track"><div id="sidebarProgress" class="progress-fill"></div></div>
      </div>

      <div class="sidebar-foot">
        <button id="resetProgress" class="text-btn">Reset local progress</button>
        <div class="tiny">Educational simulator • No account required</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open menu">☰</button>
        <div class="crumbs"><span>COUNTLAB</span><b id="crumbTitle">Dashboard</b></div>
        <div class="top-actions">
          <div class="streak"><span>🔥</span><b id="streakCount">0</b><small>day streak</small></div>
          <button id="quickDrillBtn" class="primary small">Quick Drill</button>
        </div>
      </header>

      <section id="view-dashboard" class="view active"></section>
      <section id="view-course" class="view"></section>
      <section id="view-drills" class="view"></section>
      <section id="view-shoe" class="view"></section>
      <section id="view-exam" class="view"></section>
      <section id="view-reference" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <script src="./app.js"></script>
</body>
</html>
