<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f3" />
    <meta name="description" content="JustGlance — Your life, at a glance." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Glance" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <title>JustGlance</title>
    <script>
      window.__JUSTGLANCE_MOUNTED__ = false;
      window.__JUSTGLANCE_BOOT_FAILURE__ = function (message) {
        if (window.__JUSTGLANCE_MOUNTED__) return;
        var root = document.getElementById('root');
        if (!root) return;
        var card = document.createElement('div');
        card.style.cssText = 'min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f6f1;color:#1e211f;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';
        var inner = document.createElement('div');
        inner.style.cssText = 'width:min(100%,620px);background:white;border:1px solid #dedfd8;border-radius:24px;padding:24px';
        var logo = document.createElement('div');
        logo.textContent = 'J';
        logo.style.cssText = 'width:48px;height:48px;border-radius:15px;background:#1e211f;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:18px';
        var title = document.createElement('h1');
        title.textContent = 'JustGlance could not load.';
        title.style.cssText = 'margin:0 0 8px;font-size:1.55rem';
        var detail = document.createElement('p');
        detail.textContent = String(message || 'The application module did not start.');
        detail.style.cssText = 'line-height:1.5;color:#737873';
        var button = document.createElement('button');
        button.textContent = 'Reload';
        button.style.cssText = 'min-height:44px;border:0;border-radius:13px;padding:0 18px;background:#315c4a;color:white;font-weight:800';
        button.onclick = function () { location.reload(); };
        inner.append(logo, title, detail, button);
        card.append(inner);
        root.replaceChildren(card);
      };
      window.addEventListener('error', function (event) {
        if (!window.__JUSTGLANCE_MOUNTED__) window.__JUSTGLANCE_BOOT_FAILURE__(event.message || 'The application module failed to load.');
      });
      window.addEventListener('unhandledrejection', function (event) {
        if (!window.__JUSTGLANCE_MOUNTED__) window.__JUSTGLANCE_BOOT_FAILURE__(event.reason && event.reason.message ? event.reason.message : String(event.reason || 'Startup promise failed.'));
      });
      setTimeout(function () {
        if (!window.__JUSTGLANCE_MOUNTED__) window.__JUSTGLANCE_BOOT_FAILURE__('The application bundle did not start within 8 seconds.');
      }, 8000);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#1e211f;background:#f6f6f1">Starting JustGlance…</div>
    </div>
    <script type="module" src="./src/main.tsx" onerror="window.__JUSTGLANCE_BOOT_FAILURE__ && window.__JUSTGLANCE_BOOT_FAILURE__('The compiled application bundle could not be loaded.')"></script>
  </body>
</html>
