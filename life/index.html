<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f3" />
  <meta name="description" content="JustGlance — Your life, at a glance." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Glance" />
  <title>JustGlance</title>
  <link rel="manifest" href="./manifest.webmanifest?v=214" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=214" />
  <script>
    // Old experimental JustGlance service workers must never control this recovery/static release.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ if (r.scope.indexOf('/life/') !== -1) r.unregister(); });
      }).catch(function(){});
    }
    if ('caches' in window) {
      caches.keys().then(function(keys){ keys.forEach(function(k){ if(k.indexOf('justglance')===0) caches.delete(k); }); }).catch(function(){});
    }
    window.__JUSTGLANCE_MOUNTED__ = false;
    window.addEventListener('error', function(e){
      if (window.__JUSTGLANCE_MOUNTED__) return;
      var detail = (e && e.message) || 'The application script could not start.';
      setTimeout(function(){
        if(window.__JUSTGLANCE_MOUNTED__) return;
        var root=document.getElementById('root'); if(!root)return;
        root.innerHTML='<div style="width:min(92%,650px);padding:24px;border:1px solid #ddd;border-radius:24px;background:#fff"><h1 style="margin-top:0">JustGlance could not start.</h1><p style="color:#666">'+String(detail).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})+'</p><button onclick="location.reload()" style="min-height:44px;border:0;border-radius:13px;padding:0 18px;background:#315c4a;color:#fff;font-weight:800">Reload</button></div>';
      },0);
    });
    setTimeout(function(){
      if(window.__JUSTGLANCE_MOUNTED__) return;
      var root=document.getElementById('root'); if(!root)return;
      root.innerHTML='<div style="width:min(92%,650px);padding:24px;border:1px solid #ddd;border-radius:24px;background:#fff"><h1 style="margin-top:0">JustGlance is taking too long to start.</h1><p style="color:#666">Open the browser console for the exact module/network error. This page is the direct-static organizer release, so there is no build/publishing guard.</p><button onclick="location.reload()" style="min-height:44px;border:0;border-radius:13px;padding:0 18px;background:#315c4a;color:#fff;font-weight:800">Reload</button></div>';
    },12000);
  </script>
  <script src="./config.js?v=214"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.1.1",
      "react/jsx-runtime": "https://esm.sh/react@19.1.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@19.1.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@19.1.1/client?external=react",
      "react-router-dom": "https://esm.sh/react-router-dom@7.9.1?external=react,react-dom",
      "lucide-react": "https://esm.sh/lucide-react@0.544.0?external=react",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.57.4"
    }
  }
  </script>
</head>
<body>
  <div id="root">
    <div class="boot-loading"><span></span>Loading JustGlance…</div>
  </div>
  <script type="module" src="./app.js?v=214"></script>
</body>
</html>
