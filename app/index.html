<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Aurelium Field — construction operations, estimating, field documentation and painting production in one workspace." />
    <meta name="aurelium-build" content="v0.8.2-supabase-oauth" />
    <title>Aurelium Field</title>
    <style>
      .boot-shell{min-height:100vh;display:grid;place-items:center;background:#0d0f12;color:#f3f4f5;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
      .boot-card{display:grid;justify-items:center;gap:8px;padding:28px;text-align:center;max-width:430px}.boot-card strong{font-size:18px}.boot-card span{font-size:13px;color:#9da3aa;line-height:1.5}
      .boot-mark{width:44px;height:44px;border-radius:14px;background:#f3f4f5;color:#0d0f12;display:grid;place-items:center;font-weight:800;margin-bottom:4px}
      .boot-reload{display:none;margin-top:10px;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
      .boot-shell[data-failed="true"] .boot-reload{display:block}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" data-af-boot data-failed="false" aria-live="polite">
        <div class="boot-card">
          <div class="boot-mark">A</div>
          <strong>Aurelium Field</strong>
          <span data-af-boot-copy>Loading workspace…</span>
          <button class="boot-reload" type="button" onclick="location.reload()">Reload app</button>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(() => {
        if (window.__AURELIUM_BOOTED__) return;
        const shell = document.querySelector('[data-af-boot]');
        const copy = document.querySelector('[data-af-boot-copy]');
        if (shell && copy) {
          shell.setAttribute('data-failed', 'true');
          copy.textContent = 'The application bundle did not start. Reference: AF-WEB-001';
        }
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
