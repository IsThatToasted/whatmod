<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Opening Sign In</title>
  <style>
    html,body{height:100%;margin:0;background:#f7f7f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
    body{display:grid;place-items:center}main{text-align:center;padding:28px}.spinner{width:26px;height:26px;margin:0 auto 14px;border:3px solid #d9d9de;border-top-color:#111;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{margin:0;color:#666}
  </style>
</head>
<body>
<main><div class="spinner"></div><p>Opening secure sign in…</p></main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const oauth = params.get('oauth');
  let target = null;
  try { target = oauth ? new URL(oauth) : null; } catch {}
  const allowed = target &&
    target.protocol === 'https:' &&
    target.hostname.endsWith('.supabase.co') &&
    target.pathname.includes('/auth/v1/authorize') &&
    target.searchParams.get('provider') === 'google';
  if (!allowed) {
    document.querySelector('p').textContent = 'Sign in could not be opened.';
    return;
  }
  try { sessionStorage.setItem('af_native_auth', '1'); } catch {}
  document.cookie = 'af_native_auth=1; Path=/app/; Max-Age=300; SameSite=Lax; Secure';
  location.replace(target.href);
})();
</script>
</body>
</html>
