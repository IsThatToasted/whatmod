name: AureliumField
options:
  bundleIdPrefix: com.aurelium
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
targets:
  AureliumField:
    type: application
    platform: iOS
    sources:
      - AureliumField/App/AppModel.swift
      - AureliumField/App/AureliumFieldApp.swift
      - AureliumField/App/RootView.swift
      - AureliumField/Models/Domain.swift
      - AureliumField/Features/AuthView.swift
      - AureliumField/Features/Home/HomeView.swift
      - AureliumField/Features/Projects/ProjectsView.swift
      - AureliumField/Features/Projects/FieldView.swift
      - AureliumField/Features/Chat/ChatView.swift
      - AureliumField/Features/Payroll/PayrollAdminView.swift
      - AureliumField/Features/Estimator/EstimatorView.swift
      - AureliumField/Features/Estimator/SmartScannerV2View.swift
      - AureliumField/Features/Estimator/BlueprintEstimateView.swift
      - AureliumField/Features/Team/TeamView.swift
      - AureliumField/Features/Team/AdminWorkspaceView.swift
      - AureliumField/Services/RoomPlanCaptureView.swift
      - AureliumField/Services/ExteriorSmartScanService.swift
      - AureliumField/Services/BlueprintAnalysisService.swift
      - AureliumField/Services/BlueprintCloudSync.swift
      - AureliumField/Services/ScanRecordingService.swift
      - AureliumField/Services/SpeechCaptureService.swift
      - AureliumField/Services/WorkspaceService.swift
      - AureliumField/Services/TimeClockService.swift
      - AureliumField/Services/FieldOperationsService.swift
      - AureliumField/Services/WalkthroughCloudSync.swift
      - AureliumField/Services/RuntimeConfig.swift
      - path: AureliumField/Resources/RuntimeConfig.json
        buildPhase: resources
    info:
      path: AureliumField/Resources/Info.plist
      properties:
        CFBundleDisplayName: Aurelium Field
        CFBundleShortVersionString: '0.12.0'
        CFBundleVersion: '30'
        CFBundleURLTypes:
          - CFBundleURLName: com.aurelium.field.auth
            CFBundleURLSchemes:
              - aureliumfield
        NSCameraUsageDescription: Aurelium Field uses the camera to capture jobsite photos and spatial room measurements.
        NSMicrophoneUsageDescription: Aurelium Field uses the microphone to capture narrated walkthrough notes.
        NSSpeechRecognitionUsageDescription: Aurelium Field transcribes walkthrough narration into editable field notes.
        NSLocationWhenInUseUsageDescription: Aurelium Field records jobsite location while you are clocked in so timecards can be verified.
        NSLocationAlwaysAndWhenInUseUsageDescription: Aurelium Field can record jobsite location during an active shift when background tracking is enabled by your organization.
        UIBackgroundModes:
          - location
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurelium.field
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
