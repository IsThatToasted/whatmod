name: AureliumField
options:
  bundleIdPrefix: com.aurelium
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.10'
targets:
  AureliumField:
    type: application
    platform: iOS
    sources:
      - AureliumField/App/AppModel.swift
      - AureliumField/App/AureliumFieldApp.swift
      - AureliumField/App/RootView.swift
      - AureliumField/Models/Domain.swift
      - AureliumField/Features/Home/HomeView.swift
      - AureliumField/Features/Projects/ProjectsView.swift
      - AureliumField/Features/Projects/FieldView.swift
      - AureliumField/Features/Estimator/EstimatorView.swift
      - AureliumField/Features/Team/TeamView.swift
      - AureliumField/Services/RoomPlanCaptureView.swift
      - AureliumField/Services/ScanRecordingService.swift
      - AureliumField/Services/SpeechCaptureService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurelium.field
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aurelium Field
        INFOPLIST_KEY_NSCameraUsageDescription: Aurelium Field uses the camera to capture jobsite photos and spatial room measurements.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Aurelium Field uses the microphone to capture narrated walkthrough notes.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Aurelium Field transcribes walkthrough narration into editable field notes.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
