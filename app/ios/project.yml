name: AureliumField
options:
  bundleIdPrefix: com.aurelium
  deploymentTarget:
    iOS: '17.0'
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.0.0
settings:
  base:
    SWIFT_VERSION: '5.10'
targets:
  AureliumField:
    type: application
    platform: iOS
    sources:
      - path: AureliumField
        excludes:
          - Resources/RuntimeConfig.json
      - path: AureliumField/Resources/RuntimeConfig.json
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: AureliumField/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurelium.field
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
