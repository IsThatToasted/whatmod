name: ScooterCast

options:
  bundleIdPrefix: com.whatmod
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.16.0

targets:
  ScooterCast:
    type: application
    platform: iOS

    sources:
      - path: .
        excludes:
          - README.md

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whatmod.scootercast
        PRODUCT_NAME: ScooterCast
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SCOOTERCAST_RIDER_KEY: "NOT_CONFIGURED"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

    dependencies:
      - package: LiveKit
